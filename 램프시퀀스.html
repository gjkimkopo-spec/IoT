<html>
	<head>
			<style>
				body{
					background-color:pink;
					}
				#div1{
						height:10%;
						background-color:yellow;
						color:red;
						font-size:4em;
						display:flex;
						justify-content:center;
						align-items:center;
					}
				#div2{
						height:80%;
						background-color:green;
						text-align:center;
					}
				#div3{
						height:10%;
						background-color:yellow;
						color:blue;
						font-size:4em;
						display:flex;
						justify-content:center;
						align-items:center;
					}
				.light1{
						height:20%;
						width:20%;
						accent-color:red;
					}
				#btn1{
						width:10%;
						height:15%;
						background-color:lightgreen;
						color:blue;
						font-size:3em;
					}
			</style>
			<script>
					let step=0;
					setInterval(timer1,1500);
					function timer1()
					{
						switch(step){
							case 100:
								step=1;
							break;
							case 200:
							break;
							case 300:
								document.getElementById('lamp1').checked = false;
								document.getElementById('lamp2').checked = false;
								document.getElementById('lamp3').checked = false;
								document.getElementById('lamp4').checked = false;
							break;

							case 1:
								document.getElementById('lamp1').checked = true;
								document.getElementById('lamp2').checked = false;
								document.getElementById('lamp3').checked = false;
								document.getElementById('lamp4').checked = false;
								step=2;
							break;
							case 2:
								document.getElementById('lamp1').checked = false;
								document.getElementById('lamp2').checked = true;
								document.getElementById('lamp3').checked = true;
								document.getElementById('lamp4').checked = false;
								step=3;
							break;
							case 3:
								document.getElementById('lamp1').checked = false;
								document.getElementById('lamp2').checked = true;
								document.getElementById('lamp3').checked = true;
								document.getElementById('lamp4').checked = true;
								step=4;
							break;
							case 4:
								document.getElementById('lamp1').checked = true;
								document.getElementById('lamp2').checked = true;
								document.getElementById('lamp3').checked = true;
								document.getElementById('lamp4').checked = true;
								step=1;
							break;

						}
					}
					function start()
					{
						step=100;
					}
					function pause()
					{
						step=200;
					}
					function stop()
					{
						step=300;
					}

			</script>

	</head>
	<body>
		<div id='div1'>램프 시퀀스</div>
		<div id='div2'>
			<br><br><br><br><br><br><br><br>
			<input type='radio' class='light1' id='lamp1'>
			<input type='radio' class='light1' id='lamp2'>
			<input type='radio' class='light1' id='lamp3'>
			<input type='radio' class='light1' id='lamp4'>
			<br><br><br><br><br><br><br>

			<button id='btn1' onclick='start();'>시작</button>
			&nbsp &nbsp&nbsp &nbsp
			<button id='btn1' onclick='pause();'>멈춤</button>
			&nbsp &nbsp&nbsp &nbsp
			<button id='btn1' onclick='stop();'>종료</button>


		</div>
		<div id='div3'>메카트로닉스과 김 군 진</div>
	</body>
</html>
